<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>装箱计算器</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'PingFang SC', sans-serif;
            background: #1c1917;
            color: #fafaf9;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 60px;
        }
        .header {
            max-width: 900px;
            margin: 0 auto;
            padding: 64px 24px 48px;
            text-align: center;
        }
        .eyebrow {
            font-size: 0.68em;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #a16207;
            margin-bottom: 16px;
        }
        .header h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.4em, 5vw, 3.8em);
            font-weight: 900;
            color: #fafaf9;
            letter-spacing: -0.02em;
            line-height: 1.05;
        }
        .header p {
            margin-top: 14px;
            font-size: 0.85em;
            color: #78716c;
            letter-spacing: 0.04em;
        }
        .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            gap: 12px;
            transition: background 0.18s, border-color 0.18s;
        }
        .item:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(168,85,247,0.4);
        }
        .item.drag-over-top    { border-top: 2px solid #a855f7; }
        .item.drag-over-bottom { border-bottom: 2px solid #a855f7; }
        .name {
            flex: 1;
            font-size: 0.85em;
            font-weight: 500;
            color: rgba(250,250,249,0.8);
            cursor: grab;
            user-select: none;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .name:active { cursor: grabbing; }
        .name.dragging { opacity: 0.3; }
        .stepper {
            display: flex;
            align-items: center;
            background: rgba(168,85,247,0.1);
            border: 1px solid rgba(168,85,247,0.25);
            border-radius: 10px;
            flex-shrink: 0;
        }
        .sbtn {
            width: 34px; height: 34px;
            background: none; border: none;
            cursor: pointer; font-size: 1.2em;
            font-weight: 300; color: #a855f7;
            display: flex; align-items: center; justify-content: center;
        }
        .sbtn:hover { background: rgba(168,85,247,0.2); }
        input[type="number"] {
            width: 46px; height: 34px;
            background: none; border: none;
            border-left: 1px solid rgba(168,85,247,0.25);
            border-right: 1px solid rgba(168,85,247,0.25);
            color: #fafaf9; font-size: 0.9em; font-weight: 700;
            text-align: center;
            -webkit-appearance: none; -moz-appearance: textfield; outline: none;
        }
        input[type="number"]::-webkit-spin-button { -webkit-appearance: none; }
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 28px;
        }
        .rcard {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(168,85,247,0.3);
            border-radius: 20px;
            padding: 40px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .rcard::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a855f7, transparent);
        }
        .rlabel {
            font-size: 0.65em;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #78716c;
            margin-bottom: 14px;
        }
        .rval {
            font-size: 3.2em;
            font-weight: 900;
            letter-spacing: -0.04em;
            color: #a855f7;
            line-height: 1;
        }
        .rval.active { color: #c084fc; }
        .runit {
            font-size: 0.3em;
            font-weight: 500;
            color: #78716c;
            margin-left: 4px;
            vertical-align: middle;
        }
        .btn {
            display: block;
            margin: 24px auto 0;
            padding: 14px 52px;
            background: transparent;
            color: rgba(250,250,249,0.7);
            border: 1px solid rgba(168,85,247,0.5);
            border-radius: 980px;
            font-size: 0.82em;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: rgba(168,85,247,0.1);
            border-color: #a855f7;
            color: #fafaf9;
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .results { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="eyebrow">MRJIANG · Professional</div>
        <h1>装箱计算器</h1>
        <p>International Packing Calculator</p>
    </div>
    <div class="wrap">
        <div class="grid" id="list"></div>
        <div class="results">
            <div class="rcard">
                <div class="rlabel">箱数</div>
                <div class="rval" id="boxCount">0<span class="runit">个</span></div>
            </div>
            <div class="rcard">
                <div class="rlabel">总重量</div>
                <div class="rval" id="totalWeight">0<span class="runit">g</span></div>
            </div>
        </div>
        <button class="btn" onclick="resetAll()">RESET</button>
    </div>
    <script>
        const products = [
            { name: '泰迪全身模型',            volume: 0.0050085,            weight: 650  },
            { name: '泰迪/拉姆全身毛',         volume: 0.002086875,          weight: 250  },
            { name: '泰迪头模',                volume: 0.004553182,          weight: 400  },
            { name: '泰迪头毛',                volume: 0.00050085,           weight: 60   },
            { name: '比熊全身模型',            volume: 0.010017,             weight: 900  },
            { name: '比熊全身毛',              volume: 0.002636053,          weight: 310  },
            { name: '比熊头模',                volume: 0.00455318181818182,  weight: 350  },
            { name: '比熊头毛',                volume: 0.0007155,            weight: 100  },
            { name: '拉姆全身模型',            volume: 0.005565,             weight: 700  },
            { name: '剪刀收纳夹',              volume: 0.002385,             weight: 200  },
            { name: '多功能小犬模型',          volume: 0.00417375,           weight: 290  },
            { name: '小犬全身毛',              volume: 0.000770538461538462, weight: 125  },
            { name: '泰迪头模组/支架盒装',     volume: 0.002385,             weight: 440  },
            { name: '圆筒/方毛片5个装/腿毛组', volume: 0.0016695,            weight: 250  },
        ];
        const BOX_VOLUME = 0.1;
        let dragIdx = null, dragEl = null;
        function create() {
            const list = document.getElementById('list');
            list.innerHTML = '';
            products.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = 'item';
                item.setAttribute('data-index', i);
                item.innerHTML = `<div class="name" draggable="true" data-index="${i}" title="${p.name}">${p.name}</div><div class="stepper"><button class="sbtn" onclick="step(${i},-1)">−</button><input type="number" id="q${i}" min="0" value="0" oninput="calc()"><button class="sbtn" onclick="step(${i},1)">+</button></div>`;
                list.appendChild(item);
                item.querySelector('.name').addEventListener('dragstart', s=>{ dragEl=this;dragIdx=i;this.classList.add('dragging');s.dataTransfer.effectAllowed='move'; });
                item.querySelector('.name').addEventListener('dragend',()=>{ this.classList.remove('dragging'); document.querySelectorAll('.item').forEach(e=>e.classList.remove('drag-over-top','drag-over-bottom')); dragEl=null;dragIdx=null; });
            });
            list.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';});
            list.addEventListener('dragenter',e=>{
                const t=closest(e.target); if(!t||t===dragEl?.parentNode)return;
                document.querySelectorAll('.item').forEach(e=>e.classList.remove('drag-over-top','drag-over-bottom'));
                const{top,height}=t.getBoundingClientRect();
                t.classList.add(e.clientY<top+height/2?'drag-over-top':'drag-over-bottom');
            });
            list.addEventListener('dragleave',e=>{ const t=closest(e.target);if(t)t.classList.remove('drag-over-top','drag-over-bottom'); });
            list.addEventListener('drop',e=>{
                e.stopPropagation();
                const t=closest(e.target); if(!t||t===dragEl?.parentNode)return;
                const{top,height}=t.getBoundingClientRect();
                const after=e.clientY>=top+height/2;
                let ti=parseInt(t.dataset.index);
                const mov=products.splice(dragIdx,1)[0];
                let at=after?ti+1:ti; if(dragIdx<ti)at--;
                products.splice(at,0,mov);
                create(); calc();
            });
        }
        function step(i,d){ const e=document.getElementById(`q${i}`); e.value=Math.max(0,(parseInt(e.value)||0)+d); calc(); }
        function calc(){
            let vol=0,wt=0;
            products.forEach((p,i)=>{ const q=parseInt(document.getElementById(`q${i}`).value)||0; vol+=p.volume*q; wt+=p.weight*q; });
            const boxes=vol/BOX_VOLUME;
            const b=document.getElementById('boxCount');
            b.innerHTML=`${boxes.toFixed(2)}<span class="runit">个</span>`; b.classList.toggle('active',boxes>0);
            const w=document.getElementById('totalWeight');
            w.innerHTML=wt>=1000?`${(wt/1000).toFixed(2)}<span class="runit">kg</span>`:`${wt}<span class="runit">g</span>`; w.classList.toggle('active',wt>0);
        }
        function resetAll(){ products.forEach((_,i)=>{document.getElementById(`q${i}`).value=0;}); calc(); }
        function closest(el){ while(el&&!el.classList?.contains('item')){el=el.parentNode;if(el===document.body)return null;} return el; }
        window.onload=create;
    </script>
</body>
</html>
